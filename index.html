<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philmon Abraha | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar" aria-label="Main navigation">
        <ul class="nav-menu">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        <!-- Order and position matter: document.write inserts content here. -->
        <script src="data.js"></script>
        <script src="display.js"></script>
        <noscript><p>Please enable JavaScript to view the portfolio content.</p></noscript>
        <section id="contact">
            <h2>Contact Me</h2>
            <p id="form-note">Practice form: try the HTML5 inputs and validation. This demo does not send or save messages.</p>
            <!-- No named fields: the demo reloads without putting contact data in the URL. -->
            <form class="contact-form" action="#contact" method="get" aria-describedby="form-note">
                <label for="name">Name (required)</label>
                <input type="text" id="name" autocomplete="name" required>
                <label for="email">Email (required)</label>
                <input type="email" id="email" autocomplete="email" required>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" autocomplete="tel">
                <label for="start-date">Preferred Start Date</label>
                <input type="date" id="start-date">
                <label for="budget">Budget (USD)</label>
                <input type="number" id="budget" min="0" step="100">
                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <div class="form-row">
                        <input type="radio" id="contact-email" name="contact" value="email" checked>
                        <label for="contact-email">Email</label>
                        <input type="radio" id="contact-phone" name="contact" value="phone">
                        <label for="contact-phone">Phone</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Project Timeline</legend>
                    <div class="form-row">
                        <input type="checkbox" id="asap" value="asap">
                        <label for="asap">ASAP</label>
                        <input type="checkbox" id="flexible" value="flexible">
                        <label for="flexible">Flexible</label>
                    </div>
                </fieldset>
                <label for="message">Message (required)</label>
                <textarea id="message" rows="5" required></textarea>
                <button type="submit">Check form (demo)</button>
            </form>
        </section>
    </main>
</body>
</html>
